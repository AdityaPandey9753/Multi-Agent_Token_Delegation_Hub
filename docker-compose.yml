version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: app_postgres_db
    restart: always
    env_file:
      - .env.prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: 
      - "${POSTGRES_PORT}:5432" 
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    container_name: app_flask_server
    restart: always
    env_file:
      - .env.prod
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      FLASK_ENV: production
    depends_on:
      db:
        condition: service_healthy

  client:
    build: ./client
    container_name: app_react_vite_client
    restart: always
    ports:
      - "3000:80" # Maps your laptop's port 3000 to Nginx's internal port 80
    depends_on:
      - server
  
volumes:
  pgdata: # Added the missing trailing colon here